<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달빛 DALBIT</title>
  <meta name="description" content="일상에 스며드는 차분하고 오래 입는 옷, 달빛 DALBIT" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#app">본문 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#/" aria-label="달빛 DALBIT 홈">DALBIT</a>

      <nav class="gnb" aria-label="주요 메뉴">
        <ul>
          <li><a href="#/" data-nav="home">HOME</a></li>
          <li><a href="#/shop" data-nav="shop">SHOP</a></li>
          <li><a href="#/shop/top" data-nav="top">TOP</a></li>
          <li><a href="#/shop/bottom" data-nav="bottom">BOTTOM</a></li>
          <li><a href="#/shop/outer" data-nav="outer">OUTER</a></li>
          <li><a href="#/about" data-nav="about">ABOUT</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a class="icon-link" id="wish-link" href="#/wishlist" data-nav="wishlist" aria-label="관심 상품 0개">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
          </svg>
          <span class="count" id="wish-count" aria-hidden="true" hidden>0</span>
        </a>
        <a class="icon-link" id="cart-link" href="#/cart" data-nav="cart" aria-label="장바구니 0개">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 8h14l-1 12H6L5 8z" />
            <path d="M9 8V6a3 3 0 0 1 6 0v2" />
          </svg>
          <span class="count" id="cart-count" aria-hidden="true" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">상품을 불러오는 중입니다…</p>
  </main>

  <footer class="site-footer">
    <p class="footer-logo">DALBIT</p>
    <p>일상에 스며드는 차분하고 오래 입는 옷</p>
    <p class="footer-small">배송비 3,000원 · 50,000원 이상 구매 시 무료배송</p>
    <p class="footer-small">© DALBIT</p>
  </footer>

  <script src="js/data/products.js"></script>
  <script src="js/images.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
